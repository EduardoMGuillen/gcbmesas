<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Rifas | La Gran Casa Blanca</title>
    <meta name="description" content="Ruleta de rifas de La Gran Casa Blanca.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="/LogoCasaBlanca.png">
    <link rel="canonical" href="https://www.lagrancasablanca.com/rifas">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Exo+2:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #f0d78c;
            --gold-deep: #8a6d1b;
            --ink: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
        }

        body {
            min-height: 100dvh;
        }

        .stars-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 30%, #1a1200 0%, #000 68%);
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #eee, transparent),
                radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,.75), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(212,175,55,.7), transparent),
                radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
            background-size: 200px 110px;
            animation: twinkle 18s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: .85; }
            50% { opacity: .35; }
        }

        .page {
            position: relative;
            z-index: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand {
            padding: 14px 20px 0;
            text-align: center;
            letter-spacing: .28em;
            text-transform: uppercase;
            font-size: .72rem;
            color: rgba(240, 215, 140, .78);
        }

        .stage {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 8px 16px 0;
        }

        .chips {
            min-height: 42px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 720px;
            padding: 0 12px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(0,0,0,.55);
            border: 1px solid rgba(212,175,55,.45);
            backdrop-filter: blur(8px);
            font-weight: 700;
            animation: chipIn .45s ease both;
        }

        .chip i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes chipIn {
            from { opacity: 0; transform: translateY(10px) scale(.9); }
            to { opacity: 1; transform: none; }
        }

        .wheel-frame {
            position: relative;
            width: min(86vw, 56vh, 560px);
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 14px;
            background:
                repeating-conic-gradient(from 8deg, var(--gold-deep) 0 10deg, var(--gold) 10deg 12deg, var(--gold-soft) 12deg 14deg, var(--gold) 14deg 16deg);
            box-shadow:
                0 0 0 3px #1a1406,
                0 0 50px rgba(212,175,55,.28),
                0 24px 60px rgba(0,0,0,.65);
        }

        .wheel-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            box-shadow: inset 0 0 0 3px #000;
        }

        #wheel {
            width: 100%;
            height: 100%;
            display: block;
            transform: rotate(0deg);
            will-change: transform;
        }

        .gloss {
            pointer-events: none;
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.22), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,.08), transparent 42%, rgba(0,0,0,.28));
        }

        .pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            z-index: 6;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 34px solid var(--gold);
            filter: drop-shadow(0 6px 8px rgba(0,0,0,.65));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -34px;
            left: -8px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 18px solid var(--gold-soft);
        }

        .hub {
            position: absolute;
            inset: 31%;
            z-index: 5;
            border-radius: 50%;
            background: #000;
            border: 3px solid var(--gold);
            box-shadow:
                0 0 0 6px #0b0b0b,
                0 0 28px rgba(212,175,55,.45);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hub img {
            width: 84%;
            height: 84%;
            object-fit: contain;
        }

        .controls {
            width: 100%;
            padding: 14px 18px 18px;
            background: linear-gradient(180deg, rgba(10,8,0,.2), rgba(8,6,0,.92) 24%);
            border-top: 1px solid rgba(212,175,55,.28);
            backdrop-filter: blur(16px);
        }

        .controls-row {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px 22px;
            align-items: end;
        }

        .field label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: .82rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgba(255,255,255,.72);
        }

        .field b {
            font-family: 'Orbitron', sans-serif;
            color: var(--gold-soft);
            font-size: 1.15rem;
            min-width: 2ch;
            text-align: center;
        }

        .stepper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .stepper button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(212,175,55,.7);
            background: rgba(20,14,0,.7);
            color: var(--gold-soft);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .stepper button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 99px;
            background: linear-gradient(90deg, #3a2a08, var(--gold));
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff3c4, var(--gold));
            border: 2px solid #1a1406;
            box-shadow: 0 0 12px rgba(212,175,55,.6);
            cursor: pointer;
        }

        .spin-btn {
            min-width: 168px;
            height: 56px;
            border: 0;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: .16em;
            color: #1a1200;
            background: linear-gradient(180deg, #f3e0a0, var(--gold) 46%, var(--gold-deep));
            box-shadow: 0 0 24px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.5);
            cursor: pointer;
            transition: transform .2s ease, filter .2s ease;
        }

        .spin-btn:hover:not(:disabled) { transform: translateY(-1px) scale(1.02); }
        .spin-btn:disabled { filter: grayscale(.25) brightness(.8); cursor: not-allowed; }

        .persist {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(240,215,140,.7);
            font-size: .78rem;
        }

        .dots { display: flex; gap: 6px; }
        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid var(--gold);
            background: transparent;
            transition: background .3s ease, box-shadow .3s ease;
        }
        .dots span.on {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .toast {
            position: fixed;
            left: 50%;
            top: 18px;
            transform: translate(-50%, -20px);
            opacity: 0;
            z-index: 20;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(20,14,0,.9);
            border: 1px solid var(--gold);
            color: var(--gold-soft);
            pointer-events: none;
            transition: .4s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .finale {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(40,28,0,.55), rgba(0,0,0,.88) 68%);
            overflow: hidden;
        }

        .finale.open { display: flex; }

        .finale-card {
            position: relative;
            z-index: 2;
            width: min(920px, 92vw);
            text-align: center;
            padding: 28px 18px 22px;
        }

        .finale-kicker {
            letter-spacing: .42em;
            text-transform: uppercase;
            color: var(--gold-soft);
            font-size: .78rem;
            opacity: 0;
        }

        .finale.open .finale-kicker {
            animation: rise .7s .1s ease both;
        }

        .finale-title {
            margin: 10px 0 8px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.7rem, 6vw, 3.4rem);
            line-height: 1.15;
        }

        .finale-title span {
            display: inline-block;
            background: linear-gradient(90deg, #8a6d1b, #fff1b0, #d4af37, #fff1b0, #8a6d1b);
            background-size: 220% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            transform: translateY(28px) scale(.86);
            filter: blur(8px);
        }

        .finale.open .finale-title span {
            animation: wordIn .8s ease both, shine 3.2s linear infinite;
        }

        @keyframes wordIn {
            to { opacity: 1; transform: none; filter: none; }
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            100% { background-position: 220% 50%; }
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        .gold-line {
            height: 2px;
            width: 0;
            margin: 14px auto 22px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .finale.open .gold-line {
            animation: lineGrow 1s .35s ease forwards;
        }

        @keyframes lineGrow { to { width: min(420px, 70%); } }

        .winners {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .winner {
            min-width: 108px;
            padding: 16px 14px 14px;
            border-radius: 18px;
            background: rgba(8,6,0,.78);
            border: 1px solid rgba(212,175,55,.4);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            opacity: 0;
            transform: translateY(30px) rotateX(20deg);
        }

        .finale.open .winner { animation: cardIn .7s ease both; }

        @keyframes cardIn {
            to { opacity: 1; transform: none; }
        }

        .winner .swatch {
            width: 100%;
            height: 8px;
            border-radius: 99px;
            margin-bottom: 10px;
        }

        .winner em {
            display: block;
            font-style: normal;
            font-size: .7rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: rgba(255,255,255,.55);
        }

        .winner strong {
            display: block;
            margin-top: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--gold-soft);
            text-shadow: 0 0 18px rgba(212,175,55,.45);
        }

        .finale-actions {
            margin-top: 26px;
            opacity: 0;
        }

        .finale.open .finale-actions {
            animation: rise .6s 1.1s ease both;
        }

        .again {
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold-soft);
            border-radius: 999px;
            padding: 12px 22px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .confetti, .spark {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti i {
            position: absolute;
            top: -18px;
            left: var(--x);
            width: var(--w);
            height: var(--h);
            background: var(--c);
            opacity: .95;
            transform: rotate(var(--r));
            animation: fall var(--d) var(--delay) linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: .15;
            }
        }

        .burst {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold-soft);
            left: var(--x);
            top: var(--y);
            animation: pop .9s ease-out forwards;
        }

        @keyframes pop {
            0% { transform: scale(.2); opacity: 1; box-shadow: 0 0 0 0 rgba(212,175,55,.6); }
            100% { transform: scale(7); opacity: 0; box-shadow: 0 0 40px 20px transparent; }
        }

        @media (max-width: 760px) {
            .controls-row {
                grid-template-columns: 1fr;
            }
            .spin-btn { width: 100%; }
            .wheel-frame { width: min(92vw, 52vh, 520px); padding: 10px; }
            .hub { inset: 29%; }
        }
    </style>
</head>
<body>
    <div class="stars-background"><div class="stars"></div></div>
    <div class="toast" id="toast">Números guardados para las próximas rifas</div>

    <div class="page">
        <p class="brand">La Gran Casa Blanca</p>
        <div class="stage">
            <div class="chips" id="chips"></div>
            <div class="wheel-frame">
                <div class="pointer"></div>
                <div class="wheel-inner">
                    <canvas id="wheel"></canvas>
                    <div class="gloss"></div>
                    <div class="hub">
                        <img src="/LogoCasaBlanca.png" alt="Logo Casa Blanca">
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="controls-row">
                <div class="field">
                    <label>Participantes
                        <span class="stepper">
                            <button type="button" data-target="participants" data-step="-1" aria-label="Menos participantes">−</button>
                            <b id="participantsValue">12</b>
                            <button type="button" data-target="participants" data-step="1" aria-label="Más participantes">+</button>
                        </span>
                    </label>
                    <input type="range" id="participants" min="2" max="80" step="1" value="12">
                </div>
                <div class="field">
                    <label>Ganadores
                        <span class="stepper">
                            <button type="button" data-target="winners" data-step="-1" aria-label="Menos ganadores">−</button>
                            <b id="winnersValue">1</b>
                            <button type="button" data-target="winners" data-step="1" aria-label="Más ganadores">+</button>
                        </span>
                    </label>
                    <input type="range" id="winners" min="1" max="12" step="1" value="1">
                </div>
                <button class="spin-btn" id="spinBtn" type="button">GIRAR</button>
                <div class="persist">
                    <span>Tras 4 rifas seguidas se guardan los números</span>
                    <div class="dots" id="dots">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="finale" id="finale" aria-hidden="true">
        <div class="confetti" id="confetti"></div>
        <div class="spark" id="spark"></div>
        <div class="finale-card">
            <p class="finale-kicker">La Gran Casa Blanca</p>
            <h1 class="finale-title" id="finaleTitle"></h1>
            <div class="gold-line"></div>
            <div class="winners" id="winnerCards"></div>
            <div class="finale-actions">
                <button class="again" id="againBtn" type="button">Nueva rifa</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const STORAGE_KEY = 'casablanca-rifas-saved';
            const CURRENT_KEY = 'casablanca-rifas-current';
            const STREAK_KEY = 'casablanca-rifas-streak';
            const DEFAULTS = { participants: 12, winners: 1 };

            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const participantsInput = document.getElementById('participants');
            const winnersInput = document.getElementById('winners');
            const participantsValue = document.getElementById('participantsValue');
            const winnersValue = document.getElementById('winnersValue');
            const spinBtn = document.getElementById('spinBtn');
            const chips = document.getElementById('chips');
            const dots = Array.from(document.querySelectorAll('#dots span'));
            const toast = document.getElementById('toast');
            const finale = document.getElementById('finale');
            const finaleTitle = document.getElementById('finaleTitle');
            const winnerCards = document.getElementById('winnerCards');
            const confetti = document.getElementById('confetti');
            const spark = document.getElementById('spark');
            const againBtn = document.getElementById('againBtn');

            let size = 400;
            let rotation = 0;
            let spinning = false;
            let audioCtx = null;
            let lastTickIndex = -1;
            let tickRaf = null;

            const initial = loadCurrent() || loadSaved();
            const streakState = loadStreak();
            participantsInput.value = initial.participants;
            winnersInput.value = initial.winners;
            syncWinnerMax();
            if (streakState.participants === initial.participants && streakState.winners === initial.winners) {
                paintStreak(streakState.count);
            } else {
                paintStreak(0);
            }

            function parseConfig(raw, fallback) {
                if (!raw) return fallback;
                try {
                    const parsed = JSON.parse(raw);
                    const participants = clamp(parsed.participants, 2, 80);
                    return {
                        participants: participants,
                        winners: clamp(parsed.winners, 1, participants)
                    };
                } catch (err) {
                    return fallback;
                }
            }

            function loadSaved() {
                return parseConfig(localStorage.getItem(STORAGE_KEY), { ...DEFAULTS });
            }

            function loadCurrent() {
                return parseConfig(localStorage.getItem(CURRENT_KEY), null);
            }

            function persistCurrent() {
                localStorage.setItem(CURRENT_KEY, JSON.stringify(currentConfig()));
            }

            function loadStreak() {
                try {
                    const raw = localStorage.getItem(STREAK_KEY);
                    if (!raw) return { count: 0, participants: null, winners: null };
                    return JSON.parse(raw);
                } catch (err) {
                    return { count: 0, participants: null, winners: null };
                }
            }

            function clamp(n, min, max) {
                return Math.min(max, Math.max(min, Number(n) || min));
            }

            function currentConfig() {
                return {
                    participants: Number(participantsInput.value),
                    winners: Number(winnersInput.value)
                };
            }

            function syncWinnerMax() {
                const maxWinners = Number(participantsInput.value);
                winnersInput.max = String(maxWinners);
                if (Number(winnersInput.value) > maxWinners) {
                    winnersInput.value = String(maxWinners);
                }
                participantsValue.textContent = participantsInput.value;
                winnersValue.textContent = winnersInput.value;
            }

            function colorFor(index, total) {
                return 'hsl(' + ((index * 360) / total) + ', 82%, 50%)';
            }

            function resize() {
                const css = canvas.parentElement.clientWidth;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = css * dpr;
                canvas.height = css * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                size = css;
                drawWheel();
            }

            function drawWheel() {
                const n = Number(participantsInput.value);
                const r = size / 2;
                const slice = (Math.PI * 2) / n;
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.translate(r, r);
                for (let i = 0; i < n; i++) {
                    const start = -Math.PI / 2 + i * slice;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, r - 1, start, start + slice);
                    ctx.closePath();
                    ctx.fillStyle = colorFor(i, n);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,.35)';
                    ctx.lineWidth = n > 28 ? 1 : 2;
                    ctx.stroke();

                    if (n <= 40) {
                        ctx.save();
                        ctx.rotate(start + slice / 2);
                        ctx.fillStyle = '#fff';
                        ctx.font = '700 ' + (n > 24 ? 13 : 18) + 'px "Exo 2", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'rgba(0,0,0,.75)';
                        ctx.shadowBlur = 5;
                        ctx.fillText(String(i + 1), r * 0.74, 0);
                        ctx.restore();
                    }
                }
                ctx.beginPath();
                ctx.arc(0, 0, r - 3, 0, Math.PI * 2);
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }

            function pickWinners(total, count) {
                const pool = Array.from({ length: total }, function (_, i) { return i; });
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const tmp = pool[i];
                    pool[i] = pool[j];
                    pool[j] = tmp;
                }
                return pool.slice(0, count);
            }

            function spinTo(index) {
                return new Promise(function (resolve) {
                    const n = Number(participantsInput.value);
                    const slice = 360 / n;
                    const targetMod = (360 - (index * slice + slice / 2) + 360) % 360;
                    const currentMod = ((rotation % 360) + 360) % 360;
                    let delta = targetMod - currentMod;
                    if (delta < 0) delta += 360;
                    const jitter = (Math.random() - 0.5) * slice * 0.55;
                    const loops = 5 + Math.floor(Math.random() * 3);
                    rotation += loops * 360 + delta + jitter;
                    const duration = 4.6 + Math.random() * 0.7;
                    canvas.style.transition = 'transform ' + duration + 's cubic-bezier(0.12, 0.82, 0.08, 1)';
                    canvas.style.transform = 'rotate(' + rotation + 'deg)';
                    startTicks();
                    let done = false;
                    const finish = function () {
                        if (done) return;
                        done = true;
                        canvas.removeEventListener('transitionend', onEnd);
                        stopTicks();
                        resolve();
                    };
                    const onEnd = function (event) {
                        if (event.propertyName === 'transform') finish();
                    };
                    canvas.addEventListener('transitionend', onEnd);
                    setTimeout(finish, duration * 1000 + 120);
                });
            }

            function ensureAudio() {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (Ctx) audioCtx = new Ctx();
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTick() {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 760;
                gain.gain.value = 0.028;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.025);
            }

            function readLiveRotation() {
                const style = window.getComputedStyle(canvas).transform;
                if (!style || style === 'none') return rotation;
                const match = style.match(/matrix\(([-0-9., e]+)\)/);
                if (!match) return rotation;
                const parts = match[1].split(',');
                const a = parseFloat(parts[0]);
                const b = parseFloat(parts[1]);
                let deg = Math.atan2(b, a) * (180 / Math.PI);
                if (deg < 0) deg += 360;
                return deg;
            }

            function startTicks() {
                stopTicks();
                lastTickIndex = -1;
                const step = function () {
                    const n = Number(participantsInput.value);
                    const slice = 360 / n;
                    const live = readLiveRotation();
                    const angle = (360 - (live % 360) + 360) % 360;
                    const idx = Math.floor(angle / slice) % n;
                    if (idx !== lastTickIndex) {
                        lastTickIndex = idx;
                        playTick();
                    }
                    tickRaf = requestAnimationFrame(step);
                };
                tickRaf = requestAnimationFrame(step);
            }

            function stopTicks() {
                if (tickRaf) cancelAnimationFrame(tickRaf);
                tickRaf = null;
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            function addChip(order, index) {
                const n = Number(participantsInput.value);
                const el = document.createElement('div');
                el.className = 'chip';
                el.innerHTML = '<i style="background:' + colorFor(index, n) + ';color:' + colorFor(index, n) + '"></i> Ganador ' + order + ' · #' + (index + 1);
                chips.appendChild(el);
            }

            function setBusy(busy) {
                spinning = busy;
                spinBtn.disabled = busy;
                participantsInput.disabled = busy;
                winnersInput.disabled = busy;
                spinBtn.textContent = busy ? 'GIRANDO' : 'GIRAR';
            }

            function paintStreak(count) {
                dots.forEach(function (dot, i) {
                    dot.classList.toggle('on', i < count);
                });
            }

            function registerStreak() {
                const cfg = currentConfig();
                let next = loadStreak();
                if (next.participants === cfg.participants && next.winners === cfg.winners) {
                    next.count += 1;
                } else {
                    next = { count: 1, participants: cfg.participants, winners: cfg.winners };
                }
                if (next.count >= 4) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
                    next.count = 4;
                    showToast('Números guardados para las próximas rifas');
                }
                localStorage.setItem(STREAK_KEY, JSON.stringify(next));
                paintStreak(next.count);
            }

            function resetStreakOnChange() {
                const cfg = currentConfig();
                const prev = loadStreak();
                if (prev.participants === cfg.participants && prev.winners === cfg.winners) {
                    paintStreak(prev.count);
                    return;
                }
                localStorage.setItem(STREAK_KEY, JSON.stringify({
                    count: 0,
                    participants: cfg.participants,
                    winners: cfg.winners
                }));
                paintStreak(0);
            }

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(function () { toast.classList.remove('show'); }, 3200);
            }

            function setTitle() {
                finaleTitle.innerHTML = '';
                const words = ['Estos', 'son', 'los', 'ganadores'];
                words.forEach(function (word, i) {
                    const span = document.createElement('span');
                    span.textContent = word;
                    span.style.animationDelay = (0.18 + i * 0.14) + 's, 1.4s';
                    finaleTitle.appendChild(span);
                    finaleTitle.appendChild(document.createTextNode(' '));
                });
            }

            function burstEffects(winnerIndexes) {
                confetti.innerHTML = '';
                spark.innerHTML = '';
                const n = Number(participantsInput.value);
                const palette = winnerIndexes.map(function (i) { return colorFor(i, n); }).concat(['#d4af37', '#f0d78c', '#fff1b0']);
                for (let i = 0; i < 90; i++) {
                    const piece = document.createElement('i');
                    piece.style.setProperty('--x', Math.random() * 100 + 'vw');
                    piece.style.setProperty('--d', (2.2 + Math.random() * 2.8) + 's');
                    piece.style.setProperty('--delay', (Math.random() * 0.8) + 's');
                    piece.style.setProperty('--c', palette[i % palette.length]);
                    piece.style.setProperty('--w', (6 + Math.random() * 8) + 'px');
                    piece.style.setProperty('--h', (10 + Math.random() * 12) + 'px');
                    piece.style.setProperty('--r', Math.random() * 360 + 'deg');
                    confetti.appendChild(piece);
                }
                for (let i = 0; i < 10; i++) {
                    const pop = document.createElement('div');
                    pop.className = 'burst';
                    pop.style.setProperty('--x', (10 + Math.random() * 80) + 'vw');
                    pop.style.setProperty('--y', (12 + Math.random() * 55) + 'vh');
                    pop.style.animationDelay = (Math.random() * 0.9) + 's';
                    spark.appendChild(pop);
                }
            }

            function showFinale(winnerIndexes) {
                const n = Number(participantsInput.value);
                setTitle();
                winnerCards.innerHTML = '';
                winnerIndexes.forEach(function (index, i) {
                    const card = document.createElement('div');
                    card.className = 'winner';
                    card.style.animationDelay = (0.55 + i * 0.12) + 's';
                    card.innerHTML =
                        '<div class="swatch" style="background:' + colorFor(index, n) + '"></div>' +
                        '<em>Participante</em><strong>' + (index + 1) + '</strong>';
                    winnerCards.appendChild(card);
                });
                burstEffects(winnerIndexes);
                finale.classList.add('open');
                finale.setAttribute('aria-hidden', 'false');
            }

            function closeFinale() {
                finale.classList.remove('open');
                finale.setAttribute('aria-hidden', 'true');
                chips.innerHTML = '';
                confetti.innerHTML = '';
                spark.innerHTML = '';
            }

            async function runRaffle() {
                if (spinning) return;
                ensureAudio();
                closeFinale();
                persistCurrent();
                const cfg = currentConfig();
                setBusy(true);
                const selected = pickWinners(cfg.participants, cfg.winners);
                const sequential = selected.length <= 3;
                if (sequential) {
                    for (let i = 0; i < selected.length; i++) {
                        await spinTo(selected[i]);
                        addChip(i + 1, selected[i]);
                        await wait(i === selected.length - 1 ? 900 : 900);
                    }
                } else {
                    await spinTo(selected[0]);
                    selected.forEach(function (index, i) { addChip(i + 1, index); });
                    await wait(500);
                }
                showFinale(selected);
                registerStreak();
                setBusy(false);
            }

            function onConfigChange() {
                syncWinnerMax();
                persistCurrent();
                resetStreakOnChange();
                drawWheel();
            }

            participantsInput.addEventListener('input', onConfigChange);
            winnersInput.addEventListener('input', onConfigChange);

            document.querySelectorAll('.stepper button').forEach(function (button) {
                button.addEventListener('click', function () {
                    if (spinning) return;
                    const input = document.getElementById(button.getAttribute('data-target'));
                    const next = Number(input.value) + Number(button.getAttribute('data-step'));
                    const min = Number(input.min);
                    const max = Number(input.max);
                    input.value = String(Math.min(max, Math.max(min, next)));
                    onConfigChange();
                });
            });

            spinBtn.addEventListener('click', runRaffle);
            againBtn.addEventListener('click', closeFinale);
            window.addEventListener('resize', resize);
            resize();
        })();
    </script>
</body>
</html>
